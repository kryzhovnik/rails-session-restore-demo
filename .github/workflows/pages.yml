# Build the static site and publish it to GitHub Pages.
#
# app.wasm (about 78 MB) is not kept in git. It is built locally
# (bin/rails wasmify:pack) and uploaded as the asset of the "app-wasm"
# release; this workflow downloads it into the site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: pwa/yarn.lock
      - name: Build page
        working-directory: pwa
        run: |
          yarn install --frozen-lockfile
          yarn build
      - name: Add app.wasm from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download app-wasm --pattern app.wasm --dir pwa/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
